<!doctype html>
<!--
  Mockup: the same query page in a window too narrow for the form and the panel side by side.
  The Query Helper starts collapsed to a strip, and the page keeps that strip's width free, so
  nothing in the form is covered. "Show Query Helper" opens it, and the page then scrolls
  sideways when it has to, because the form's inputs have a fixed size.
-->
<html lang="en" class="sdt-docked sdt-docked--collapsed">
<head>
<meta charset="utf-8">
<title>Query: Parcels (ID: 0), narrow window (mockup)</title>
<link rel="stylesheet" href="host-standin.css">
<link rel="stylesheet" href="sdt.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-insert" viewBox="0 0 24 24"><path d="M19 5v7a3 3 0 0 1-3 3H6"/><path d="M10 11l-4 4 4 4"/></symbol>
  <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-glyph" viewBox="0 0 16 16"><rect class="sdt-glyph__bg" width="16" height="16" rx="4"/><path class="sdt-glyph__mark" d="M5 3.5v9M5 6h4.5M5 10.5h4.5"/><circle class="sdt-glyph__dot" cx="11.2" cy="6" r="1.4"/><circle class="sdt-glyph__dot" cx="11.2" cy="10.5" r="1.4"/></symbol>
</svg>

<table width="100%" class="userTable">
<tr>

<tr valign="top">
<td class="breadcrumbs">
<a href="#home">Home</a>

<tr><td class="apiref"><a href="#json">JSON</a></td></tr>
</table>
<h2>Query: Parcels (ID: 0)</h2>
<div class="rbody">
<form name="sdform" action="#query">
<table class="formTable">
<tr valign="top">
<td><label for="where">Where:</label></td>
<td><input type="text" id="where" name="where" value="LAND_USE = 'R' AND OWNER_NAME = " size="75"/></td>
</tr>
<tr valign="top">
<td><label for="text">Text:</label></td>
<td><input type="text" id="text" name="text" value="" size="75"/></td>
</tr>
<tr valign="top">
<td><label for="objectIds">Object IDs:</label></td>
<td><input type="text" id="objectIds" name="objectIds" value="" size="75"/></td>
</tr>
<tr valign="top">
<td><label for="outFields">Out Fields:</label></td>
<td><input type="text" id="outFields" name="outFields" value="" size="75"/></td>
</tr>
<tr>
<td>Return Geometry:</td>
<td>
  <label><input type="radio" name="returnGeometry" value="true" checked /> True &nbsp;</label>
  <label><input type="radio" name="returnGeometry" value="false" /> False</label>
</td>
</tr>
<tr>
<td>Return IDs Only:</td>
<td>
  <label><input type="radio" name="returnIdsOnly" value="true" /> True &nbsp;</label>
  <label><input type="radio" name="returnIdsOnly" value="false" checked /> False</label>
</td>
</tr>
<tr>
<td>Return Count Only:</td>
<td>
  <label><input type="radio" name="returnCountOnly" value="true" /> True &nbsp;</label>
  <label><input type="radio" name="returnCountOnly" value="false" checked /> False</label>
</td>
</tr>
<tr valign="top">
<td><label for="orderByFields">Order By Fields:</label></td>
<td><input type="text" id="orderByFields" name="orderByFields" value="" size="75"/></td>
</tr>
<tr valign="top">
<td><label for="groupByFieldsForStatistics">Group By Fields (For Statistics):</label></td>
<td><input type="text" id="groupByFieldsForStatistics" name="groupByFieldsForStatistics" value="" size="75"/></td>
</tr>
<tr valign="top">
<td><label for="outStatistics">Output Statistics:</label></td>
<td><textarea id="outStatistics" name="outStatistics" rows="5" cols="55"></textarea></td>
</tr>
<tr>
<td>Return Distinct Values:</td>
<td>
  <label><input type="radio" name="returnDistinctValues" value="true" /> True &nbsp;</label>
  <label><input type="radio" name="returnDistinctValues" value="false" checked /> False</label>
</td>
</tr>
<tr>
<td><label for="f">Format:</label></td>
<td><select id="f" name="f"><option value="html">HTML</option><option value="pjson">JSON</option></select></td>
</tr>
<tr>
<td colspan="2" align="left">
<input type="submit" value="Query (GET)" />
<input type="submit" value="Query (POST)" />
</td>
</tr>
</table>
</form>
</div>

    <button class="sdt-button sdt-button--quiet" type="button" aria-expanded="false" aria-label="Show Query Helper"><svg class="sdt-icon" aria-hidden="true"><use href="#i-chev-l"/></svg></button>
    <svg class="sdt-glyph" aria-hidden="true"><use href="#i-glyph"/></svg>
    <h2 class="sdt-panel__title" id="qh-title">Query Helper</h2>
  </div>
</aside>

</html>
