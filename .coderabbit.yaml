# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main"]
  path_filters:
    - "!package-lock.json"
    - "!build/**"
    - "!src/icons/**"
  path_instructions:
    - path: "src/**/*.js"
      instructions: |
        Chrome Manifest V3 extension; vanilla JS with no bundler. Content scripts run on
        untrusted ArcGIS REST pages and render untrusted server JSON: flag any innerHTML,
        insertAdjacentHTML, outerHTML, document.write or eval, and require DOM construction
        with text nodes instead. Flag MV2-only APIs (chrome.extension.*, background pages,
        the page_action manifest key, chrome.pageAction). The src/src/page_action/ folder
        name is historical and fine.
        Requests go through SDT.net.fetchJson; automatic ones through SDT.net.pageLimiter().
        Flag fetch or XMLHttpRequest outside src/src/lib/, any token placed in a URL, the DOM or
        a console message, and a token sent to a URL whose SDT.auth.scopeOf differs from the
        page's. Classes the extension injects start with sdt: the shared components' root class
        sdt, or sdt-.
    - path: "src/src/lib/**"
      instructions: |
        Shared classic scripts. Each starts with globalThis.SDT ??= {} and assigns one SDT namespace;
        flag top-level const, let, function or class declarations. A lib file may use only the SDT
        namespaces of files loaded before it: the manifest's content_scripts groups and
        page_action.html list them in one order, which the build checks. sender.js is the
        exception: only the service worker loads it, with importScripts. writer.js is loaded only
        by the options page (and the popup from Phase 9); flag a content_scripts group that lists
        it. settings.js holds every setting's default, allowed values and label; flag a default
        written anywhere else. theme.js decides the in-page palette from computed colours and
        must ignore its own attribute writes; icon.js builds SVG with createElementNS only.
    - path: "src/src/lib/sdt.css"
      instructions: |
        The shared stylesheet loads into every Services Directory page, the popup and the options
        page. Flag any selector that doesn't name an sdt class (except the :root token blocks,
        which may set only --sdt-* custom properties), colours written as literals instead of
        --sdt-* tokens, a change to one dark token block that isn't made to the other, a colour
        token that isn't a one-line hex value (scripts/check-contrast.js reads them), and
        anything newer than Chrome 120, such as light-dark() or CSS nesting.
    - path: "src/src/inject/**"
      instructions: |
        Content scripts can outlive their extension after an update. Flag addEventListener calls,
        timers, chrome.* callbacks and promise callbacks that don't go through SDT.guard, and top-level
        code that runs before SDT.guard.onLoad or SDT.guard.run. Each script checks
        SDT.page.classify before doing anything, and does nothing on jsonView and other.
        Content scripts never write to chrome.storage (set, remove or clear); lint enforces it.
        They read settings only with await SDT.settings.read(keys), which validates; lint rejects
        chrome.storage.*.get here.
        The status bar in status.js has one listener on the bar, its Load more button's click, plus a
        pageshow listener on window, both added through SDT.guard; flag any other handler. Requests go through SDT.net.fetchJson or an SDT.status
        job's fetch (the identifier name job is reserved for it); flag any other fetch call.
    - path: "src/manifest.json"
      instructions: |
        Flag any new permissions or host_permissions and explain why each is needed. The
        toolbar button starts disabled (action.default_state) and is enabled by an enableAction
        message from status.js, which the service worker accepts only through SDT.sender; flag
        any declarativeContent rule. Flag web_accessible_resources, which the build refuses.
        Content-script patterns follow Esri's casing: the Query Helper group matches only
        .../query, and the GP group only GPServer/*/execute and GPServer/*/submitJob, each with
        or without a trailing slash and a query string. The
        version must match package.json. Every content_scripts group lists the lib files
        first, in the order dom, guard, auth, url, net, page, settings, theme, icon, and the css
        list starts with src/lib/sdt.css.
    - path: "src/src/options/**"
      instructions: |
        Static HTML with one control per SDT.settings key, whose name is the key;
        tests/unit/options-page.test.js checks them against the schema. Flag a default, allowed
        value, range or label written here instead of in src/src/lib/settings.js, a selector
        built from a stored value, a direct chrome.storage write instead of SDT.writer.save,
        and a success message shown before the save resolves.
    - path: "src/src/bg/**"
      instructions: |
        Classic service worker. It acts on a runtime message only when
        SDT.sender.accepts(sender, chrome.runtime.id) is true, and catches rejected chrome.action
        promises. Flag a handler that skips the check or leaves a promise unhandled.
    - path: "tests/fixtures/**"
      instructions: |
        Fixtures must be synthetic. Flag anything that looks copied from a real ArcGIS
        Server or Esri sample service: real service names, descriptions or captured
        responses.
  tools:
    eslint:
      enabled: true
    gitleaks:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/CLAUDE.md"

chat:
  auto_reply: true
