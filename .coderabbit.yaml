# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main"]
  path_filters:
    - "!package-lock.json"
    - "!build/**"
    - "!src/icons/**"
  path_instructions:
    - path: "src/**/*.js"
      instructions: |
        Chrome Manifest V3 extension; vanilla JS with no bundler. Content scripts run on
        untrusted ArcGIS REST pages and render untrusted server JSON: flag any innerHTML,
        insertAdjacentHTML, outerHTML, document.write or eval, and require DOM construction
        with text nodes instead. Flag MV2-only APIs (chrome.extension.*, background pages,
        the page_action manifest key, chrome.pageAction). The src/src/page_action/ folder
        name is historical and fine.
        Requests go through SDT.net.fetchJson; automatic ones through SDT.net.pageLimiter().
        Flag fetch or XMLHttpRequest outside src/src/lib/, any token placed in a URL, the DOM or
        a console message, and a token sent to a URL whose SDT.auth.scopeOf differs from the
        page's. Classes the extension injects start with sdt-.
    - path: "src/src/lib/**"
      instructions: |
        Shared classic scripts. Each starts with globalThis.SDT ??= {} and assigns one SDT namespace;
        flag top-level const, let, function or class declarations. A lib file may use only the SDT
        namespaces of files loaded before it: the manifest's content_scripts groups and
        page_action.html list them in one order, which the build checks.
    - path: "src/src/inject/**"
      instructions: |
        Content scripts can outlive their extension after an update. Flag addEventListener calls,
        timers, chrome.* callbacks and promise callbacks that don't go through SDT.guard, and top-level
        code that runs before SDT.guard.onLoad or SDT.guard.run. Each script checks
        SDT.page.classify before doing anything, and does nothing on jsonView and other.
    - path: "src/manifest.json"
      instructions: |
        Flag any new permissions or host_permissions and explain why each is needed. The
        toolbar button is enabled by an enableAction message from status.js, not by
        declarativeContent rules; flag any attempt to reintroduce them. The version must
        match package.json. Every content_scripts group lists the lib files first, in the
        order dom, guard, auth, url, net, page.
    - path: "src/src/{options,config}/**"
      instructions: |
        Settings defaults are repeated in places that must agree: options.html/options.js,
        src/src/config/options.json, and each content script's chrome.storage.sync.get
        defaults. Flag keys, values or defaults that diverge.
    - path: "tests/fixtures/**"
      instructions: |
        Fixtures must be synthetic. Flag anything that looks copied from a real ArcGIS
        Server or Esri sample service: real service names, descriptions or captured
        responses.
  tools:
    eslint:
      enabled: true
    gitleaks:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/CLAUDE.md"

chat:
  auto_reply: true
