<!doctype html>
<html lang="en" data-sdt-theme="system">
<head>
	<title>Services Directory Toolkit</title>
	<link rel="stylesheet" type="text/css" href="../lib/sdt.css" />
	<link rel="stylesheet" type="text/css" href="page_action.css" />
</head>
<body>
	<div id="mainPopup">
		<h1>Services Directory Toolkit</h1>
	</div>
	<div id="urlshortcontent">
		<fieldset>
			<legend>URL Shortener</legend>
			<input style="width: 100%;" type="text" id="urlshortblank" aria-label="Shortened URL" />
			<button id="copybtn">Copy to Clipboard</button>
		</fieldset>
	</div>
	<form>
		<fieldset>
			<legend>REST Search</legend>
			<p>Search for map services, layers, fields, etc. with the following relevant text:</p> 
			<input style="width: 75%;" type="text" id="searchblank" placeholder="Searches current folder and subdirectories" />
			<button id="searchbtn">Search</button>
			<br />
			<b>Locations searched: </b><span id="searchedfeatures"> </span><br />
			<b>Results found: </b><span id="searchresultscount"> </span>
			<ul id="searchresults"></ul>
		</fieldset>
	</form>
	<p id="optionsfoot"><a id="optionslink" href="../options/options.html">Options</a></p>
	<script src="../lib/dom.js"></script>
	<script src="../lib/guard.js"></script>
	<script src="../lib/auth.js"></script>
	<script src="../lib/url.js"></script>
	<script src="../lib/net.js"></script>
	<script src="../lib/status.js"></script>
	<script src="../lib/row.js"></script>
	<script src="../lib/page.js"></script>
	<script src="../lib/settings.js"></script>
	<script src="../lib/theme.js"></script>
	<script src="../lib/icon.js"></script>
	<script src="search.js"></script>
	<script src="url_shortener.js"></script>
	<script src="options_link.js"></script>
</body>
</html>
